<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#063b2d">
<meta name="description" content="نور الإسلام - مواقيت الصلاة والقرآن والأذكار والقبلة والمساجد القريبة">
<title>نور الإسلام</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
    radial-gradient(circle at top,#0c5b45 0,#063b2d 38%,#021f18 100%);
    color:#fff;
    min-height:100vh;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,31,24,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(212,175,55,.25);
}

.navbar{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#e5c45a;
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

.nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
}

.nav button{
    background:transparent;
    border:1px solid transparent;
    color:white;
    padding:9px 11px;
    border-radius:10px;
}

.nav button:hover{
    color:#e5c45a;
    border-color:#d4af37;
}

/* HERO */
.hero{
    text-align:center;
    padding:65px 15px 45px;
}

.hero h1{
    color:#e5c45a;
    font-size:clamp(38px,7vw,65px);
    margin-bottom:15px;
}

.hero p{
    color:#d9e8e2;
    line-height:1.9;
    font-size:18px;
}

/* CARDS */
.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(212,175,55,.22);
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.section-title{
    text-align:center;
    margin-bottom:20px;
}

.section-title h2{
    color:#e5c45a;
    margin-bottom:8px;
}

.section-title p{
    color:#c8d8d2;
    line-height:1.7;
}

/* INPUTS */
.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input,select{
    flex:1;
    min-width:200px;
    background:#062f25;
    color:#fff;
    border:1px solid rgba(212,175,55,.35);
    border-radius:12px;
    padding:13px 15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#e5c45a;
}

.primary-btn{
    background:linear-gradient(135deg,#d4af37,#f0d36b);
    color:#10251e;
    border:none;
    padding:13px 18px;
    border-radius:12px;
    font-weight:bold;
}

.primary-btn:hover{
    transform:translateY(-2px);
}

/* PRAYER */
.prayer-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.prayer-box{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    padding:18px 10px;
    text-align:center;
}

.prayer-box.next{
    border-color:#e5c45a;
    box-shadow:0 0 20px rgba(229,196,90,.18);
}

.prayer-name{
    color:#e5c45a;
    margin-bottom:8px;
}

.prayer-time{
    font-size:24px;
    font-weight:bold;
}

.date-row{
    text-align:center;
    color:#d6e4de;
    line-height:2;
    margin-top:18px;
}

/* TRACKING */
.tracking{
    margin-top:25px;
}

.progress{
    height:12px;
    background:#092d24;
```
